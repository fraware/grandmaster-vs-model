name: Observe championship broadcast stream without model calls
on:
  workflow_dispatch:
  schedule:
    # One short independent session per hour over the match-day observation
    # window. GitHub Actions cron is best effort; delayed or missed starts
    # are explicitly possible. Every session has its own retained artifact.
    - cron: '3 14-23 24,25,26,28,29,30 11 *'
    - cron: '3 14-23 2,3,4,6,7,8,10,11 12 *'
permissions:
  contents: read
# Independent jobs are permitted to overlap if GitHub delays a scheduled start.
# They never write to the repository and each upload is uniquely named.
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate streaming and source protocol before observing
        run: node --test tests/stream-observer.test.mjs && npm run verify:2026
      - name: Observe the actual scheduled round without any provider credentials
        env:
          STREAM_DURATION_MS: '3300000'
        run: npm run stream:observe
      - name: Preserve read-only source observations for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-broadcast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/observations/
            data/collection.json
            artifacts/shadow/
          if-no-files-found: warn
          retention-days: 90
