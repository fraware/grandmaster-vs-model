name: Observe championship broadcast stream without model calls
on:
  workflow_dispatch:
  schedule:
    # Exact classical-round dates; scheduled Actions starts remain best effort.
    - cron: '5 14 24,25,26,28,29,30 11 *'
    - cron: '5 14 2,3,4,6,7,8,10,11 12 *'
permissions:
  contents: read
concurrency:
  group: championship-shadow-stream
  cancel-in-progress: false
jobs:
  shadow:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate streaming and source protocol before observing
        run: node --test tests/stream-observer.test.mjs && npm run verify:2026
      - name: Observe the actual scheduled round without any provider credentials
        env:
          STREAM_DURATION_MS: '5400000'
        run: npm run stream:observe
      - name: Preserve read-only source observations for reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-broadcast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/observations/
            data/collection.json
          if-no-files-found: warn
          retention-days: 14
