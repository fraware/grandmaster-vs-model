name: Capture prospective forecasts
on:
  workflow_dispatch:
  schedule:
    # GitHub cron is best effort, not a precision real-time scheduler.
    # The collector enforces the match date window independently.
    - cron: '2-59/5 13-23 * 11,12 *'
    - cron: '2-59/5 0-1 * 11,12 *'
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: championship-collector
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current data before sampling
        run: npm test && npm run verify:2026 && npm run verify && npm run verify:collection
      - name: Prepare immutable reservations without calling providers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAPTURE_SAMPLE_EVERY: '5'
          CAPTURE_MAX_REQUESTS: '900'
          CAPTURE_PROVIDERS: 'openai'
        run: npm run capture:reserve
      - name: Validate reserved source observations and model slots
        run: npm run verify:collection
      - name: Publish reservations to GitHub before spending
        id: reservation
        shell: bash
        run: |
          set -euo pipefail
          new_claims="$(git ls-files --others --exclude-standard -- data/claims)"
          if [ -z "$(git status --porcelain -- data/claims data/observations data/collection.json)" ]; then
            echo 'No new source observations or reservations'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/claims data/observations data/collection.json
          git commit -m 'Reserve championship requests before inference'
          git push origin HEAD:main
          git fetch --quiet origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if [ -n "$new_claims" ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Execute only remotely committed reservations
        if: steps.reservation.outputs.execute == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAPTURE_SAMPLE_EVERY: '5'
          CAPTURE_MAX_REQUESTS: '900'
          CAPTURE_PROVIDERS: 'openai'
        run: npm run capture:execute
      - name: Check collection integrity
        run: |
          npm run verify:collection
          npm run verify
      - name: Enumerate newly generated attempt records
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files --others --exclude-standard -z -- data/attempts)
          if (( ${#files[@]} > 0 )); then
            printf '%s\0' "${files[@]}" | xargs -0 sha256sum > "$RUNNER_TEMP/forecast-attempts.sha256"
            echo 'new_attempts=true' >> "$GITHUB_OUTPUT"
            echo "Prepared ${#files[@]} forecast record(s) for signed provenance"
          else
            echo 'No newly generated forecast records to attest'
          fi
          if [ -n "$(git status --porcelain -- data/observations data/attempts data/collection.json)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Sign forecast record digests with workflow provenance
        id: evidence_attest
        if: steps.evidence.outputs.new_attempts == 'true'
        # Evidence publication must continue if the attestation service is unavailable.
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/forecast-attempts.sha256
      - name: Preserve capture records before Git push
        if: steps.evidence.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: capture-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/claims/
            data/observations/
            data/attempts/
            data/collection.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish sourced observations and recorded attempts
        run: |
          if [ -z "$(git status --porcelain -- data/observations data/attempts data/collection.json)" ]; then
            echo 'No new observations or model attempts'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/observations data/attempts data/collection.json
          git commit -m 'Record championship broadcast observations and model attempts'
          git push origin HEAD:main
