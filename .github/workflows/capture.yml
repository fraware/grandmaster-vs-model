name: Capture prospective forecasts
on:
  workflow_dispatch:
  schedule:
    # Only the 14 published game dates (14:00–01:00 UTC next day).
    # GitHub cron is best effort, not a precision real-time scheduler.
    # The collector also enforces activeRound() independently.
    - cron: '2-59/5 14-23 24,25,26,28,29,30 11 *'
    - cron: '2-59/5 0 25,26,27,29,30 11 *'
    - cron: '2-59/5 0 1 12 *'
    - cron: '2-59/5 14-23 2,3,4,6,7,8,10,11 12 *'
    - cron: '2-59/5 0 3,4,5,7,8,9,11,12 12 *'
permissions:
  contents: write
  actions: write
  id-token: write
  attestations: write
concurrency:
  group: championship-collector
  cancel-in-progress: false
jobs:
  season:
    # GitHub cron has no year field. Expired 2026 invocations skip the
    # expensive capture job; manual dispatch still allows safe diagnostics.
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - id: check
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$(date -u +%Y)" == "2026" ]]; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          else
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
          fi
  capture:
    needs: season
    if: needs.season.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate current data before sampling
        run: npm test && npm run verify:2026 && npm run verify && npm run verify:collection
      - name: Prepare immutable reservations without calling providers
        id: prepare
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAPTURE_SAMPLE_EVERY: '5'
          CAPTURE_MAX_REQUESTS: '900'
          CAPTURE_PROVIDERS: 'openai'
        run: npm run capture:reserve
      - name: Validate reserved source observations and model slots
        run: npm run verify:collection
      - name: Publish reservations to GitHub before spending
        id: reservation
        shell: bash
        run: |
          set -euo pipefail
          new_claims="$(git ls-files --others --exclude-standard -- data/claims)"
          if [ -z "$(git status --porcelain -- data/claims data/observations data/collection.json)" ]; then
            echo 'No new source observations or reservations'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # New reservations are optional when only the broadcast changes.
          # Stage the generated data tree without a nonexistent pathspec.
          git add -A -- data
          git commit -m 'Reserve championship requests before inference'
          git push origin HEAD:main
          git fetch --quiet origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          echo 'published=true' >> "$GITHUB_OUTPUT"
          if [ -n "$new_claims" ]; then
            echo 'execute=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Execute only remotely committed reservations
        if: steps.reservation.outputs.execute == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAPTURE_SAMPLE_EVERY: '5'
          CAPTURE_MAX_REQUESTS: '900'
          CAPTURE_PROVIDERS: 'openai'
        run: npm run capture:execute
      # A paid request can complete and still leave the job unsuccessful
      # (process interruption, postflight exception, invalid local index).
      # Recover any on-disk records before running validation or attestation.
      # These artifacts are unverified recovery material, not certified claims.
      - name: Detect uncommitted recovery evidence after execution
        id: recovery
        if: ${{ always() && steps.prepare.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- data/claims data/observations data/attempts data/collection.json)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Preserve recovery evidence before any later validation or push
        if: ${{ always() && steps.recovery.outputs.changed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: capture-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/claims/
            data/observations/
            data/attempts/
            data/collection.json
          if-no-files-found: error
          retention-days: 30
      - name: Check collection integrity
        run: |
          npm run verify:collection
          npm run verify
      - name: Enumerate newly generated attempt records
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files --others --exclude-standard -z -- data/attempts)
          if (( ${#files[@]} > 0 )); then
            printf '%s\0' "${files[@]}" | xargs -0 sha256sum > "$RUNNER_TEMP/forecast-attempts.sha256"
            echo 'new_attempts=true' >> "$GITHUB_OUTPUT"
            echo "Prepared ${#files[@]} forecast record(s) for signed provenance"
          else
            echo 'No newly generated forecast records to attest'
          fi
      - name: Sign forecast record digests with workflow provenance
        id: evidence_attest
        if: steps.evidence.outputs.new_attempts == 'true'
        # Evidence publication must continue if the attestation service is unavailable.
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/forecast-attempts.sha256
      - name: Publish sourced observations and recorded attempts
        id: final_publish
        run: |
          if [ -z "$(git status --porcelain -- data/observations data/attempts data/collection.json)" ]; then
            echo 'No new observations or model attempts'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/observations data/attempts data/collection.json
          git commit -m 'Record championship broadcast observations and model attempts'
          git push origin HEAD:main
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Dispatch GitHub Pages explicitly for bot-authored data commits
        # GITHUB_TOKEN push events intentionally do not trigger Pages workflows.
        # Dispatch even if inference failed after a successful claim publication.
        if: ${{ always() && (steps.reservation.outputs.published == 'true' || steps.final_publish.outputs.published == 'true') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
