name: Test and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and provider-adapter contract tests
        run: npm test
      - name: Validate forecast and outcome ledger
        run: npm run verify
      - name: Check generated match snapshot
        run: |
          npm run build:data
          git diff --exit-code -- data/match.json
          npm run verify:collection && npm run verify:retrospective && npm run verify:history && npm run verify:2026
          npm run build:collection
          git diff --exit-code -- data/collection.json
      - name: JavaScript syntax
        run: |
          node --check app.mjs
          node --check src/home.mjs
          node --check src/challenge-ui.mjs
          node --check src/retro-view.mjs
          node --check src/retrospective.mjs
          node --check scripts/retrospective-run.mjs
          node --check src/chess.mjs
          node --check src/pgn.mjs
          node --check src/history.mjs
          node --check src/match-2026.mjs
          node --check scripts/verify-match-2026.mjs
          node --check scripts/build-history-2024.mjs
          node --check src/broadcast.mjs
          node --check scripts/cache-broadcast.mjs
          python3 -c "import ast; from pathlib import Path; ast.parse(Path('tests/browser-smoke.py').read_text())"
          node --check scripts/provider-smoke.mjs
          node --check scripts/model-runner.mjs
          node --check scripts/forecast-cycle.mjs
          node --check scripts/stream-observer.mjs
          node --check scripts/collection.mjs
          node --check src/collection.mjs
          node --check src/reservations.mjs
  browser:
    # Playwright 1.57 does not support GitHub's Ubuntu 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned browser test runtime
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test the historical game and all 14 registered live round selections
        run: python tests/browser-smoke.py