name: Test and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and provider-adapter contract tests
        run: npm test
      - name: Validate forecast and outcome ledger
        run: npm run verify
      - name: Check generated match snapshot
        run: |
          npm run build:data
          git diff --exit-code -- data/match.json
          npm run verify:collection && npm run verify:retrospective && npm run verify:history
          npm run build:collection
          git diff --exit-code -- data/collection.json
      - name: JavaScript syntax
        run: |
          node --check app.mjs
          node --check src/home.mjs
          node --check src/challenge-ui.mjs
          node --check src/retro-view.mjs
          node --check src/retrospective.mjs
          node --check scripts/retrospective-run.mjs
          node --check src/chess.mjs
          node --check src/pgn.mjs
          node --check src/history.mjs
          node --check scripts/build-history-2024.mjs
          node --check src/broadcast.mjs
          node --check scripts/cache-broadcast.mjs
          python3 -c "import ast; from pathlib import Path; ast.parse(Path('tests/browser-smoke.py').read_text())"
          node --check scripts/provider-smoke.mjs
          node --check scripts/model-runner.mjs
          node --check scripts/forecast-cycle.mjs
          node --check scripts/collection.mjs
          node --check src/collection.mjs
