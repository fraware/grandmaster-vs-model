name: Capture real live chess spectator preview
on:
  workflow_dispatch:
  push:
    branches: [feat/live-spectator-challenge]
    paths:
      - app.mjs
      - lab.html
      - style.css
      - src/spectator.mjs
      - scripts/capture-live-preview.py
      - .github/workflows/live-preview.yml
permissions:
  contents: write
concurrency:
  group: spectator-visual-preview
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Chromium screenshot dependencies
        run: |
          python -m pip install playwright==1.57.0 Pillow==12.0.0
          python -m playwright install --with-deps chromium
      - name: Render real desktop and mobile screens against an offline pregame fixture
        run: python scripts/capture-live-preview.py
      - name: Commit reproducible previews to the development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/live-preview.webp assets/live-preview-mobile.webp
          if git diff --cached --quiet; then
            echo 'Preview already up to date'
            exit 0
          fi
          git commit -m 'Refresh rendered live spectator previews'
          git push origin HEAD:feat/live-spectator-challenge
