name: Refresh desktop chess challenge preview
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/tournament-workspace-redesign
    paths:
      - theme.css
      - index.html
      - landing.css
      - scripts/build-social-card.py
      - scripts/capture-preview.py
      - .github/workflows/preview.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: chess-visual-preview
  cancel-in-progress: false
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned visual runtime
        run: |
          python -m pip install playwright==1.57.0 Pillow==12.0.0
          python -m playwright install --with-deps chromium
      - name: Validate first-screen board and regenerate previews
        run: |
          python scripts/capture-preview.py
          python scripts/build-social-card.py
      - name: Commit the actual browser preview and refresh Pages when on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/preview.webp assets/share-cover.png; then
            echo 'Preview already matches the rendered site'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/preview.webp assets/share-cover.png
          git commit -m 'Update verified desktop challenge preview'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          # Bot-authored pushes are not ordinary Pages triggers.
          if [ "${GITHUB_REF_NAME}" = main ]; then
            gh workflow run pages.yml --ref main
          fi
