name: Publish site
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test && npm run verify && npm run build:data && git diff --exit-code -- data/match.json && npm run verify:collection && npm run verify:retrospective && npm run verify:history && npm run verify:2026 && npm run build:collection && git diff --exit-code -- data/collection.json
      - name: Install pinned event-preview renderer
        run: python -m pip install --disable-pip-version-check Pillow==12.0.0
      - name: Stage static site
        run: |
          mkdir -p _site
          cp index.html lab.html app.mjs style.css landing.css theme.css favicon.svg _site/
          cp -R src data assets _site/
          python scripts/build-live-social-card.py --out _site/assets/live-share-cover.png
          python scripts/build-live-social-card.py --historical --out _site/assets/share-cover.png
          node scripts/cache-broadcast.mjs --out _site/data/live-game1.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Separate deployment from upload so the GitHub artifact metadata can be
      # indexed before deploy-pages looks it up. Retrying a failed deploy job
      # then does not repeat the successful upload or create a duplicate.
      - id: deployment
        uses: actions/deploy-pages@v4
