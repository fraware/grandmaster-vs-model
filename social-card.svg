<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Grandmaster vs Model — Predict the human</title>
<desc id="desc">Editorial chess design with one large knight and a headline in dark ink on warm paper.</desc>
<rect width="1200" height="630" fill="#f5f2eb"/>
<rect x="0" y="0" width="19" height="630" fill="#98432e"/>
<path d="M85 94H1115" stroke="#c5c4ba"/>
<text x="89" y="64" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="23" letter-spacing="2" fill="#30352d">GRANDMASTER <tspan fill="#98432e">vs</tspan> MODEL</text>
<text x="89" y="264" font-family="Georgia,serif" font-size="85" fill="#292c26">Predict the human.</text>
<text x="89" y="364" font-family="Georgia,serif" font-size="85" font-style="italic" fill="#98432e">Not just the move.</text>
<path d="M89 416H740" stroke="#c5c4ba"/>
<text x="90" y="467" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5e625b">GUKESH  ×  SINDAROV  /  GENEVA 2026</text>
<text x="90" y="580" font-family="Arial,Helvetica,sans-serif" font-weight="bold" letter-spacing="3" font-size="20" fill="#98432e">A PUBLIC CHESS FORECASTING EXPERIMENT</text>
<text x="820" y="497" font-family="Georgia,serif" font-size="450" fill="#68745f" opacity="0.88">♞</text>
</svg>
